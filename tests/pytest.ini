[pytest]
# Môi trường chạy (sandbox) không cho ghi vào thư mục do tempfile.mkdtemp tạo
# (mode 0o700) nên plugin cache của pytest luôn thất bại và còn để lại thư mục
# rác "pytest-cache-files-*". Tắt hẳn plugin cache để `pytest tests -q` sạch.
addopts = -p no:cacheprovider
norecursedirs = pytest-cache-files-* *_m700 __pycache__ .* *.egg build dist node_modules venv
